; mdfw.ini - MD/Snap built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/Snap
output = build/md-snap.mdfw
; Built on the SidecarTridge microfirmware template: its own main() runs,
; with EmuMD standing in for the template's hardware (romemul.c,
; commemul.c, select.c, hw_config.c and sdcard.c are left out) and the
; Booster. The version comes from version.txt; the app UUID is given here
; because uuid.txt is not in git.
template = sidecartridge
uuid = c586d331-a715-4f3b-882e-138385c9900d

[sources]
; The firmware, as rp/src/CMakeLists.txt lists it, and emu/standins.c for
; what EmuMD does not stand in for yet. download.c is left out: nothing
; calls it, and it needs an HTTP client the stand-in lacks. So is
; u8g2_d_setup.c, u8g2's stock display setups, which name drivers this copy
; of u8g2 does not carry: display.c sets the display up itself, and the
; device's linker drops the file as unused.
files =
    rp/src/*.c
    rp/src/settings/settings.c
    rp/src/u8g2/*.c
    emu/standins.c
exclude =
    rp/src/download.c
    rp/src/u8g2/u8g2_d_setup.c

[compile]
shims =
include =
    rp/src
    rp/src/include
    rp/src/settings
    rp/src/u8g2
; What rp/src/CMakeLists.txt defines, besides the template's usual ones.
defines =
    PICO_FLASH_ASSUME_CORE0_SAFE=1
    APP_DOWNLOAD_HTTPS=0
cflags = -O2

; The template's network code is built in (blink.c and term.c use it), as
; on the Pico W; MD/Snap itself makes no connections. Needs libslirp.
[wifi]
lwip = pico-sdk/lib/lwip
arch = poll

[run]
machine = ste
sd = build/sd          ; the microSD card: /screenshots is made in here
